<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/icons/drop.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<title>الشكاوى والمقترحات | منصة سقيا</title>
</head>
<body data-page="complaints" data-protected="true">
<header id="site-header" class="site-header"></header>
<main class="container">
  <h2 class="page-title">الشكاوى والمقترحات</h2>
  <p class="page-sub">نحرص على تحسين خدماتنا. يمكنك إرسال شكوى أو ملاحظة أو اقتراح وسيتم تسجيلها ومتابعتها.</p>
  <form id="complaintForm" class="card" novalidate>
    <div class="form-grid">
      <div class="field"><label for="cpName">الاسم الكامل</label><input id="cpName" type="text" autocomplete="name"><span class="err"></span></div>
      <div class="field"><label for="cpPhone">رقم الهاتف</label><input id="cpPhone" type="tel" inputmode="tel"><span class="err"></span></div>
      <div class="field"><label for="cpType">نوع الرسالة</label><select id="cpType"><option value="">اختر النوع</option><option>شكوى</option><option>اقتراح</option><option>ملاحظة</option><option>أخرى</option></select><span class="err"></span></div>
      <div class="field"><label for="cpOrder">رقم الطلب <small>(اختياري)</small></label><input id="cpOrder" type="text" dir="ltr" placeholder="SUG-2026-0001"></div>
      <div class="field full"><label for="cpTitle">عنوان الشكوى</label><input id="cpTitle" type="text"><span class="err"></span></div>
      <div class="field full"><label for="cpDetails">تفاصيل الشكوى</label><textarea id="cpDetails"></textarea><span class="err"></span></div>
    </div>
    <div class="actions"><button type="submit" id="cpBtn" class="btn btn-primary">إرسال</button></div>
  </form>
  <section class="section-gap">
    <h2 class="page-title">متابعة شكوى</h2>
    <form id="findForm" class="card inline-form" novalidate>
      <div class="field"><label for="fId">رقم الشكوى</label><input id="fId" type="text" dir="ltr" placeholder="CMP-2026-0001" autocomplete="off"><span class="err"></span></div>
      <button type="submit" id="findBtn" class="btn btn-primary">متابعة</button>
    </form>
    <div id="cResult" aria-live="polite"></div>
  </section>
</main>
<footer id="site-footer" class="site-footer"></footer>
<script src="js/app.js"></script>
</body>
</html>
